<!DOCTYPE html>
<html>
<head>
  <title>Simple Greeting</title>
  <style>
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
    }

    #message {
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Time-Based Greeting Message</h2>
  <button onclick="showGreeting()">Show Greeting</button>
  <p id="message"></p>

  <script>
    function showGreeting() {
      const now = new Date();
      const hour = now.getHours();
      let greeting = "";

      if (hour >= 5 && hour < 12) {
        greeting = "Good Morning!";
      } else if (hour >= 12 && hour < 17) {
        greeting = "Good Afternoon!";
      } else if (hour >= 17 && hour < 20) {
        greeting = "Good Evening!";
      } else {
        greeting = "Good Night!";
      }

      document.getElementById("message").textContent = greeting;
    }
  </script>

</body>
</html>
